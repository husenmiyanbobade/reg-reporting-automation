<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Regulatory Reports - Filing Status Check</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
  .header { background: #1a3c5e; color: white; padding: 15px 20px; border-radius: 6px; margin-bottom: 20px; }
  .container { background: white; border-radius: 6px; padding: 24px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
  h2 { color: #1a3c5e; margin-top: 0; }
  .btn { padding: 9px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; background: #1a3c5e; color: white; margin-top: 8px; }
  #result-wrapper { margin-top: 14px; }
  .status-box { padding: 12px 16px; border-radius: 4px; font-size: 14px; }
  .status-accepted { background: #d4edda; color: #155724; }
  .status-rejected { background: #f8d7da; color: #721c24; }
  .status-error { background: #fff3cd; color: #856404; }
  .status-loading { color: #666; font-style: italic; }
</style>
</head>
<body>
  <div class="header">📊 Regulatory Reporting Portal — Filing Status Check</div>

  <div class="container">
    <h2>Check Filing Status with Regulator</h2>
    <p style="font-size: 13px; color: #666;">Report RPT-001 (EMIR, Q1 2024)</p>
    <button class="btn" id="check-status-btn" data-testid="check-status-btn">Check Status</button>
    <div id="result-wrapper" data-testid="result-wrapper"></div>
  </div>

  <div class="container">
    <h2>Submit Report to Regulator</h2>
    <button class="btn" id="submit-filing-btn" data-testid="submit-filing-btn">Submit RPT-001</button>
    <div id="submit-result-wrapper" data-testid="submit-result-wrapper"></div>
  </div>

  <script>
    document.getElementById('check-status-btn').addEventListener('click', async () => {
      const wrapper = document.getElementById('result-wrapper');
      wrapper.innerHTML = '<div class="status-loading" data-testid="status-loading">Checking with regulator...</div>';

      try {
        const response = await fetch('https://api.regulator-mock.com/filings/RPT-001/status');

        if (!response.ok) {
          wrapper.innerHTML = `<div class="status-box status-error" data-testid="status-result">⚠️ Error checking status (HTTP ${response.status})</div>`;
          return;
        }

        const data = await response.json();
        const cssClass = data.status === 'Accepted' ? 'status-accepted' : 'status-rejected';
        wrapper.innerHTML = `<div class="status-box ${cssClass}" data-testid="status-result">Status: ${data.status} — ${data.message}</div>`;
      } catch (err) {
        wrapper.innerHTML = '<div class="status-box status-error" data-testid="status-result">⚠️ Could not reach regulator system. Please try again later.</div>';
      }
    });

    document.getElementById('submit-filing-btn').addEventListener('click', async () => {
      const wrapper = document.getElementById('submit-result-wrapper');
      wrapper.innerHTML = '<div class="status-loading" data-testid="submit-loading">Submitting...</div>';

      try {
        const response = await fetch('https://api.regulator-mock.com/filings/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reportId: 'RPT-001' })
        });

        const data = await response.json();

        if (response.ok) {
          wrapper.innerHTML = `<div class="status-box status-accepted" data-testid="submit-result">✅ ${data.message}</div>`;
        } else {
          wrapper.innerHTML = `<div class="status-box status-error" data-testid="submit-result">❌ ${data.message}</div>`;
        }
      } catch (err) {
        wrapper.innerHTML = '<div class="status-box status-error" data-testid="submit-result">⚠️ Submission failed — network error.</div>';
      }
    });
  </script>
</body>
</html>
