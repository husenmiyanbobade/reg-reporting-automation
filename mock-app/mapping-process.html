<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Regulatory Reports - Mapping Process</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
  .header { background: #1a3c5e; color: white; padding: 15px 20px; border-radius: 6px; margin-bottom: 20px; }
  .container { background: white; border-radius: 6px; padding: 24px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); max-width: 480px; }
  h2 { color: #1a3c5e; margin-top: 0; }
  label { display: block; font-size: 13px; color: #555; margin: 14px 0 4px; }
  select, input { padding: 8px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
  .btn { padding: 10px 22px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; background: #1a3c5e; color: white; margin-top: 20px; }
  #result-wrapper { margin-top: 18px; }
  .result-box { padding: 12px 16px; border-radius: 4px; font-size: 14px; }
  .success { background: #d4edda; color: #155724; }
  .conflict { background: #fff3cd; color: #856404; }
  .error { background: #f8d7da; color: #721c24; }
  .loading { color: #666; font-style: italic; }
</style>
</head>
<body>
  <div class="header">📊 Regulatory Reporting Portal — Mapping Process</div>

  <div class="container">
    <h2>Run Mapping Process</h2>

    <label for="model-name">Model Name</label>
    <select id="model-name" data-testid="model-name-select">
      <option value="ResNet50">ResNet50</option>
      <option value="BERT-Base">BERT-Base</option>
      <option value="GPT-Mini">GPT-Mini</option>
    </select>

    <label for="dependency-version">Dependency Version</label>
    <input type="text" id="dependency-version" data-testid="dependency-version-input" placeholder="e.g. 2.3.1" value="2.3.1">

    <label for="environment">Environment</label>
    <select id="environment" data-testid="environment-select">
      <option value="Dev">Dev</option>
      <option value="QA">QA</option>
      <option value="Prod">Prod</option>
    </select>

    <button class="btn" id="run-mapping-btn" data-testid="run-mapping-btn">Run Mapping</button>

    <div id="result-wrapper" data-testid="result-wrapper"></div>
  </div>

  <script>
    document.getElementById('run-mapping-btn').addEventListener('click', async () => {
      const wrapper = document.getElementById('result-wrapper');
      wrapper.innerHTML = '<div class="loading" data-testid="mapping-loading">Running mapping process...</div>';

      const payload = {
        model: document.getElementById('model-name').value,
        dependencyVersion: document.getElementById('dependency-version').value,
        environment: document.getElementById('environment').value
      };

      try {
        const response = await fetch('https://api.mapping-mock.com/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.status === 200) {
          wrapper.innerHTML = `<div class="result-box success" data-testid="mapping-result">✅ Mapping completed. ID: ${data.mappingId}</div>`;
        } else if (response.status === 409) {
          wrapper.innerHTML = `<div class="result-box conflict" data-testid="mapping-result">⚠️ Conflict: ${data.message}</div>`;
        } else {
          wrapper.innerHTML = `<div class="result-box error" data-testid="mapping-result">❌ ${data.message}</div>`;
        }
      } catch (err) {
        wrapper.innerHTML = '<div class="result-box error" data-testid="mapping-result">❌ Could not reach mapping system.</div>';
      }
    });
  </script>
</body>
</html>
