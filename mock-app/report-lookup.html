<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Regulatory Reports - Report Lookup</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
  .header { background: #1a3c5e; color: white; padding: 15px 20px; border-radius: 6px; margin-bottom: 20px; }
  .container { background: white; border-radius: 6px; padding: 24px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  h2 { color: #1a3c5e; margin-top: 0; }
  input { padding: 8px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; width: 200px; }
  .btn { padding: 9px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; background: #1a3c5e; color: white; margin-left: 8px; }
  #result-wrapper { margin-top: 16px; }
  .result-box { padding: 12px 16px; border-radius: 4px; background: #eef3f9; font-size: 14px; }
  .loading { color: #666; font-style: italic; }
  .error-box { padding: 12px 16px; border-radius: 4px; background: #f8d7da; color: #721c24; font-size: 14px; }
</style>
</head>
<body>
  <div class="header">📊 Regulatory Reporting Portal — Report Lookup</div>

  <div class="container">
    <h2>Look Up Report by ID</h2>
    <input type="text" id="report-id-input" data-testid="report-id-input" placeholder="Enter report ID (1-100)">
    <button class="btn" id="fetch-report-btn" data-testid="fetch-report-btn">Fetch Report</button>

    <div id="result-wrapper" data-testid="result-wrapper"></div>
  </div>

  <script>
    document.getElementById('fetch-report-btn').addEventListener('click', async () => {
      const id = document.getElementById('report-id-input').value.trim();
      const wrapper = document.getElementById('result-wrapper');

      if (!id) {
        wrapper.innerHTML = '<div class="error-box" data-testid="report-error">Please enter a report ID.</div>';
        return;
      }

      wrapper.innerHTML = '<div class="loading" data-testid="report-loading">Fetching report...</div>';

      try {
        const response = await fetch(`https://jsonplaceholder.typicode.com/posts/${id}`);

        if (!response.ok) {
          wrapper.innerHTML = `<div class="error-box" data-testid="report-error">Report ${id} not found (HTTP ${response.status})</div>`;
          return;
        }

        const data = await response.json();
        wrapper.innerHTML = `
          <div class="result-box" data-testid="report-result">
            <strong data-testid="report-title">${data.title}</strong>
            <p data-testid="report-body" style="margin:8px 0 0; color:#555;">${data.body}</p>
          </div>`;
      } catch (err) {
        wrapper.innerHTML = '<div class="error-box" data-testid="report-error">Could not reach reporting system.</div>';
      }
    });
  </script>
</body>
</html>
